# Lab 7: Loki in single-binary mode with filesystem storage (one pod, no caches, no MinIO).
# Since March 2026 the Loki chart is maintained by the community in grafana-community.
# Grafana reads it through the gateway: http://loki-gateway.monitoring
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: loki
    targetRevision: 21.2.3      # helm search repo grafana-community/loki (Loki 3.7.10)
    helm:
      valuesObject:
        deploymentMode: SingleBinary
        loki:
          auth_enabled: false            # single tenant, no X-Scope-OrgID header needed
          commonConfig: {replication_factor: 1}
          storage: {type: filesystem}
          schemaConfig:
            configs:
              - from: "2024-01-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index: {prefix: index_, period: 24h}
        singleBinary: {replicas: 1}
        read: {replicas: 0}
        write: {replicas: 0}
        backend: {replicas: 0}
        chunksCache: {enabled: false}
        resultsCache: {enabled: false}
        lokiCanary: {enabled: false}
        test: {enabled: false}
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
