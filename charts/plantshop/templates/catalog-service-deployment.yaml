# Plants and categories; GET /api/catalog/info shows the version and the pod that answered.
# Replaced by catalog-service-rollout.yaml when catalogService.rollout.enabled (Lab 6):
# a Deployment and a Rollout with the same selector must never exist together.
{{- if not .Values.catalogService.rollout.enabled }}
{{- $c := .Values.catalogService }}
{{- $component := "catalog-service" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "plantshop.componentName" (dict "root" . "component" $component) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "plantshop.labels" (dict "root" . "component" $component) | nindent 4 }}
  annotations:
    # Shown by "kubectl rollout history": which Helm revision produced this Deployment revision
    kubernetes.io/change-cause: {{ printf "Helm revision %d, image %s" .Release.Revision (include "plantshop.image" (dict "root" . "component" $component "values" $c)) | quote }}
spec:
  replicas: {{ $c.replicaCount }}
  {{- with $c.progressDeadlineSeconds }}
  # How long a rollout may make no progress before the Deployment (and the Argo CD app) is Degraded
  progressDeadlineSeconds: {{ . }}
  {{- end }}
  revisionHistoryLimit: 5
  minReadySeconds: {{ .Values.rollingUpdate.minReadySeconds }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.rollingUpdate.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "plantshop.selectorLabels" (dict "root" . "component" $component) | nindent 6 }}
  template:
    {{- include "plantshop.catalogService.podTemplate" . | nindent 4 }}
{{- end }}
