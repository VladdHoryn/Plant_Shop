# Direct in-cluster access to order-service (the gateway itself balances through Eureka)
{{- $c := .Values.orderService }}
{{- $component := "order-service" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "plantshop.componentName" (dict "root" . "component" $component) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "plantshop.labels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  type: {{ $c.service.type }}
  selector:
    {{- include "plantshop.selectorLabels" (dict "root" . "component" $component) | nindent 4 }}
  ports:
    - name: http
      port: {{ $c.service.port }}
      targetPort: http
