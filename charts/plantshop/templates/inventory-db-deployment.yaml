# PostgreSQL for inventory-service. The database is created by the image (POSTGRES_DB);
# the schema and tables are created by Flyway when inventory-service starts.
{{- $component := "inventory-db" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "plantshop.componentName" (dict "root" . "component" $component) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "plantshop.labels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  replicas: 1
  # The volume is ReadWriteOnce: the old pod must stop before the new one mounts it
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "plantshop.selectorLabels" (dict "root" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "plantshop.selectorLabels" (dict "root" . "component" $component) | nindent 8 }}
        app.kubernetes.io/part-of: {{ include "plantshop.name" . }}
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: {{ printf "%s:%s" .Values.postgres.image.repository (toString .Values.postgres.image.tag) }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: inventory_db
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "plantshop.secretName" . }}
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "plantshop.secretName" . }}
                  key: DB_PASSWORD
            # A subdirectory, because the volume root may contain lost+found
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          {{- if .Values.postgres.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "plantshop.componentName" (dict "root" . "component" (printf "%s-data" $component)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
