{{- if not .Values.existingSecret }}
{{- /*
Database credentials shared by the four PostgreSQL instances and the services that use them.
The values come from .Values.database. When no password is given, the one already stored in this
release's Secret is reused (so an upgrade never changes it under the existing databases); on the
first install a random password is generated.
*/ -}}
{{- $name := include "plantshop.secretName" . }}
{{- $password := .Values.database.password }}
{{- if not $password }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data }}
{{- $password = index $existing.data "DB_PASSWORD" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 24 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "plantshop.labels" (dict "root" . "component" "db-secret") | nindent 4 }}
type: Opaque
data:
  DB_USERNAME: {{ .Values.database.username | b64enc | quote }}
  DB_PASSWORD: {{ $password | b64enc | quote }}
{{- end }}
