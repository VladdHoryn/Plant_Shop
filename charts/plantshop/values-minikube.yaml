# Environment managed by Argo CD (argocd-apps/plantshop.yaml) on minikube.
# Applied on top of values.yaml. A release = a commit that changes catalogService.image.tag.

# Created by hand, never stored in Git:
#   kubectl -n plantshop create secret generic plantshop-secret \
#     --from-literal=DB_USERNAME=plantshop --from-literal=DB_PASSWORD=<generated>
existingSecret: plantshop-secret

# Images from Docker Hub: vladyslavv648/plantshop-<module>:<tag>
image:
  tag: "1.0.0"
  pullPolicy: IfNotPresent

configService:
  replicaCount: 1
  image:
    repository: vladyslavv648/plantshop-config-service
    # 1.1.0: catalog-service config with /actuator/prometheus, histogram buckets, ECS JSON logs, FAIL_RATE
    tag: "1.1.0"

discoveryService:
  replicaCount: 1
  image:
    repository: vladyslavv648/plantshop-discovery-service

apiGateway:
  replicaCount: 1
  image:
    repository: vladyslavv648/plantshop-api-gateway
  service:
    # Reached with: kubectl -n plantshop port-forward svc/plantshop-api-gateway 8081:80
    type: ClusterIP

catalogService:
  # 4 pods: every 25% canary step is exactly one more pod of the new version
  replicaCount: 4
  # A broken rollout (e.g. a missing image tag) turns the app Degraded after 5 minutes instead of 10
  # (longer than in Lab 6: a canary step now also waits for the 2-minute analysis)
  progressDeadlineSeconds: 300
  # Lab 7: "bad behaviour" switch. FAIL_RATE is the share of /api/** requests answered with 500.
  # A bad release = a commit that sets it to "0.5" (pod template change -> new canary).
  env:
    - name: FAIL_RATE
      value: "0"
  # Lab 6: canary release. No traffic router, so the weight is the share of pods of the new version;
  # api-gateway balances over Eureka instances, which gives the same ratio.
  # Lab 7: the manual pause is replaced by an analysis step: Prometheus decides (success rate >= 95%).
  rollout:
    enabled: true
    analysis:
      enabled: true
      prometheusAddress: http://kps-prometheus.monitoring:9090
      selector: 'namespace="plantshop",service="plantshop-catalog-service"'
    strategy:
      canary:
        maxSurge: 1          # at most one extra pod during a step
        maxUnavailable: 0
        steps:
          - setWeight: 25    # 1 of 4 pods on the new version
          - pause: {duration: 30s}   # let the canary serve traffic and Prometheus scrape it
          - analysis:
              templates:
                - templateName: plantshop-catalog-service-success-rate
          - setWeight: 50
          - pause: {duration: 20s}
          - setWeight: 75
          - pause: {duration: 20s}
  # Lab 7: ServiceMonitor (/actuator/prometheus) + Grafana dashboard ConfigMap; alert on 5xx share > 5%
  metrics:
    enabled: true
  alerts:
    enabled: true
  image:
    repository: vladyslavv648/plantshop-catalog-service
    # Own tag, so a release (or a bad tag) touches only catalog-service
    tag: "1.5.0"

inventoryService:
  replicaCount: 1
  image:
    repository: vladyslavv648/plantshop-inventory-service

orderService:
  replicaCount: 1
  image:
    repository: vladyslavv648/plantshop-order-service

paymentService:
  replicaCount: 1
  image:
    repository: vladyslavv648/plantshop-payment-service

# The gateway is reached through port-forward. An Ingress without an address keeps
# the app Progressing in Argo CD, so it is not rendered here.
ingress:
  enabled: false

# Argo CD turns Helm "pre-upgrade" hooks into PreSync hooks that run before every sync
# (including the first one, when the databases do not exist yet), and it does not run
# "helm test" hooks at all, so neither is rendered in this environment.
hooks:
  preUpgradeCheck:
    enabled: false
tests:
  enabled: false
