# In-cluster address of the catalog-service database: catalog-db:5432
apiVersion: v1
kind: Service
metadata:
  name: catalog-db
  namespace: plantshop
  labels:
    app: catalog-db
    app.kubernetes.io/part-of: plantshop
spec:
  type: ClusterIP
  selector:
    app: catalog-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
