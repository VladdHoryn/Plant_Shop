# Direct in-cluster access to order-service (the gateway itself balances through Eureka)
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: plantshop
  labels:
    app: order-service
    app.kubernetes.io/part-of: plantshop
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - name: http
      port: 8083
      targetPort: http
