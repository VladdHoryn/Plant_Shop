# Storage for the payment-service PostgreSQL data (minikube's default "standard" StorageClass
# provisions it dynamically). The data survives pod restarts and redeploys.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: payment-db-data
  namespace: plantshop
  labels:
    app: payment-db
    app.kubernetes.io/part-of: plantshop
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
