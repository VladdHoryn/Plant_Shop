# Database credentials shared by the four PostgreSQL instances and the services that use them.
# Demo values only, not used by any real system. stringData is base64-encoded by the API server;
# see it with: kubectl -n plantshop get secret plantshop-db-secret -o jsonpath='{.data.DB_PASSWORD}' | base64 -d
apiVersion: v1
kind: Secret
metadata:
  name: plantshop-db-secret
  namespace: plantshop
  labels:
    app.kubernetes.io/part-of: plantshop
type: Opaque
stringData:
  DB_USERNAME: "plantshop"
  DB_PASSWORD: "k8s-lab-demo-pass"
