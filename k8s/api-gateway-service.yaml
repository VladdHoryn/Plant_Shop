# Entry point of the application.
#   inside the cluster:  http://api-gateway  (port 80)
#   from the host:       NodePort 30080 -> "minikube service api-gateway -n plantshop --url"
#                        or through the Ingress (api-gateway-ingress.yaml)
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: plantshop
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: plantshop
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
