# In-cluster address of the payment-service database: payment-db:5432
apiVersion: v1
kind: Service
metadata:
  name: payment-db
  namespace: plantshop
  labels:
    app: payment-db
    app.kubernetes.io/part-of: plantshop
spec:
  type: ClusterIP
  selector:
    app: payment-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
