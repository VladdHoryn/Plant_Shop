# In-cluster address of the order-service database: order-db:5432
apiVersion: v1
kind: Service
metadata:
  name: order-db
  namespace: plantshop
  labels:
    app: order-db
    app.kubernetes.io/part-of: plantshop
spec:
  type: ClusterIP
  selector:
    app: order-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
