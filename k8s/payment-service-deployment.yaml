# Simulated payment provider (declines amounts above PAYMENT_MAX_AMOUNT from the ConfigMap)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: plantshop
  labels:
    app: payment-service
    app.kubernetes.io/part-of: plantshop
  annotations:
    kubernetes.io/change-cause: "Initial deployment, image 1.0.0"
spec:
  replicas: 1
  revisionHistoryLimit: 5
  # A new pod counts as available only after it has been ready for 15 s, which gives the
  # Eureka clients (registry refresh every 5 s) time to see it before an old pod is stopped
  minReadySeconds: 15
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
        tier: backend
        app.kubernetes.io/part-of: plantshop
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 45
      # Kubernetes has no depends_on: wait until the dependencies accept connections
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              for target in config-service:8888 discovery-service:8761 kafka:9092 payment-db:5432; do
                until nc -z -w 2 ${target%:*} ${target#*:}; do
                  echo "waiting for $target"; sleep 3
                done
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
      containers:
        - name: payment-service
          image: plantshop/payment-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8084
          envFrom:
            - configMapRef:
                name: plantshop-config
            - secretRef:
                name: plantshop-db-secret
          env:
            - name: DB_HOST
              value: payment-db
          resources:
            requests:
              cpu: 100m
              memory: 320Mi
            limits:
              cpu: "1"
              memory: 640Mi
          # Spring Boot exposes the liveness/readiness health groups automatically on Kubernetes.
          # The startup probe gives the JVM up to 3 minutes before the other probes take over.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
