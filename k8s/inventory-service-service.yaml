# Direct in-cluster access to inventory-service (the gateway itself balances through Eureka)
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: plantshop
  labels:
    app: inventory-service
    app.kubernetes.io/part-of: plantshop
spec:
  type: ClusterIP
  selector:
    app: inventory-service
  ports:
    - name: http
      port: 8082
      targetPort: http
