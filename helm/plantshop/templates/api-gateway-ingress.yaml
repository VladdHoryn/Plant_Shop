{{- if .Values.ingress.enabled }}
# HTTP access from the host through the ingress controller (minikube: "minikube addons enable ingress")
{{- $component := "api-gateway" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "plantshop.componentName" (dict "root" . "component" $component) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "plantshop.labels" (dict "root" . "component" $component) | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "plantshop.componentName" (dict "root" . "component" $component) }}
                port:
                  name: http
{{- end }}
