server:
  port: 8084

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5436}/payment_db
    username: ${plantshop.db.username}
    password: ${plantshop.db.password}
  flyway:
    schemas: payments
    default-schema: payments
    create-schemas: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: payments
  kafka:
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: paymentCompleted:com.plantshop.payment.event.PaymentCompletedEvent,paymentFailed:com.plantshop.payment.event.PaymentFailedEvent
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.plantshop.*
        spring.json.type.mapping: inventoryReserved:com.plantshop.payment.event.InventoryReservedEvent

# Simulated payment provider: payments above this amount are declined
payment:
  max-amount: 10000
