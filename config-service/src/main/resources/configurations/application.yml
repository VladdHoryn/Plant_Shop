# Shared configuration served to every client service

# Short registry/heartbeat intervals so services find each other seconds after startup
# (defaults are 30s, which makes the first requests fail with "No servers available")
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

spring:
  cloud:
    loadbalancer:
      cache:
        ttl: 5s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Credentials shared by all databases. Each service has its own PostgreSQL instance;
# its JDBC URL is defined in <service>.yml.
plantshop:
  db:
    username: ${DB_USERNAME:plantshop}
    password: ${DB_PASSWORD:plantshop}

# On SIGTERM (how Kubernetes stops a pod) finish in-flight requests before exiting
server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
