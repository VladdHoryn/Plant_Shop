server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/order_db
    username: ${plantshop.db.username}
    password: ${plantshop.db.password}
  flyway:
    schemas: orders
    default-schema: orders
    create-schemas: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: orders
  kafka:
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: orderCreated:com.plantshop.order.event.OrderCreatedEvent
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.plantshop.*
        spring.json.type.mapping: inventoryFailed:com.plantshop.order.event.InventoryFailedEvent,paymentCompleted:com.plantshop.order.event.PaymentCompletedEvent,paymentFailed:com.plantshop.order.event.PaymentFailedEvent
