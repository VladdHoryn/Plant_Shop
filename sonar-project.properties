# SonarQube analysis of the whole multi-module project (Lab 8). No token here: the scanner reads SONAR_TOKEN
# from the environment (scripts/sonar-scan.sh). Compile first (./mvnw -DskipTests package): the Java analyzer
# needs the bytecode of every module (sonar.java.binaries). File keys look like
# plantshop:<module>/src/main/java/<package path>/<Class>.java
sonar.projectKey=plantshop
sonar.projectName=Plant Shop
sonar.projectVersion=lab-08
sonar.sourceEncoding=UTF-8
sonar.java.source=21
sonar.scm.disabled=true

sonar.sources=\
  secure-logging/src/main/java,\
  config-service/src/main/java,\
  discovery-service/src/main/java,\
  api-gateway/src/main/java,\
  catalog-service/src/main/java,\
  inventory-service/src/main/java,\
  order-service/src/main/java,\
  payment-service/src/main/java,\
  user-service/src/main/java

sonar.tests=\
  secure-logging/src/test/java,\
  catalog-service/src/test/java,\
  inventory-service/src/test/java,\
  order-service/src/test/java,\
  payment-service/src/test/java,\
  user-service/src/test/java

sonar.java.binaries=\
  secure-logging/target/classes,\
  config-service/target/classes,\
  discovery-service/target/classes,\
  api-gateway/target/classes,\
  catalog-service/target/classes,\
  inventory-service/target/classes,\
  order-service/target/classes,\
  payment-service/target/classes,\
  user-service/target/classes

sonar.java.test.binaries=\
  secure-logging/target/test-classes,\
  catalog-service/target/test-classes,\
  inventory-service/target/test-classes,\
  order-service/target/test-classes,\
  payment-service/target/test-classes,\
  user-service/target/test-classes
