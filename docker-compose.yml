# Starts the whole Plant Shop stack:  docker compose up -d --build
# Infrastructure only (to run the services from the IDE):
#   docker compose up -d catalog-db inventory-db order-db payment-db kafka kafka-ui

x-postgres: &postgres
  image: postgres:16-alpine
  environment: &postgres-env
    POSTGRES_USER: plantshop
    POSTGRES_PASSWORD: plantshop
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U plantshop -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 5s
    retries: 10
  restart: unless-stopped

# Spring services are probed by opening their HTTP port (the JRE image has bash but no curl)
x-port-healthcheck: &port-healthcheck
  interval: 10s
  timeout: 5s
  retries: 20
  start_period: 20s

x-spring-env: &spring-env
  CONFIG_SERVER_URL: http://config-service:8888
  EUREKA_URL: http://discovery-service:8761/eureka
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  DB_PORT: 5432

x-business-service: &business-service
  restart: unless-stopped
  depends_on: &business-deps
    config-service:
      condition: service_healthy
    discovery-service:
      condition: service_healthy
    kafka:
      condition: service_healthy

services:
  # ---------- Databases: one PostgreSQL instance per service (schemas created by Flyway) ----------
  catalog-db:
    <<: *postgres
    container_name: plantshop-catalog-db
    environment:
      <<: *postgres-env
      POSTGRES_DB: catalog_db
    ports: ["5433:5432"]
    volumes: [catalog-db-data:/var/lib/postgresql/data]

  inventory-db:
    <<: *postgres
    container_name: plantshop-inventory-db
    environment:
      <<: *postgres-env
      POSTGRES_DB: inventory_db
    ports: ["5434:5432"]
    volumes: [inventory-db-data:/var/lib/postgresql/data]

  order-db:
    <<: *postgres
    container_name: plantshop-order-db
    environment:
      <<: *postgres-env
      POSTGRES_DB: order_db
    ports: ["5435:5432"]
    volumes: [order-db-data:/var/lib/postgresql/data]

  payment-db:
    <<: *postgres
    container_name: plantshop-payment-db
    environment:
      <<: *postgres-env
      POSTGRES_DB: payment_db
    ports: ["5436:5432"]
    volumes: [payment-db-data:/var/lib/postgresql/data]

  # ---------- Messaging ----------
  kafka:
    image: apache/kafka:3.9.0
    container_name: plantshop-kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT is for clients on the host, INTERNAL for containers on the compose network
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 15s
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: plantshop-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: plantshop
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # ---------- Platform services ----------
  config-service:
    build:
      context: .
      args: { SERVICE: config-service }
    image: plantshop/config-service
    container_name: plantshop-config-service
    ports: ["8888:8888"]
    healthcheck:
      <<: *port-healthcheck
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/8888"]
    restart: unless-stopped

  discovery-service:
    build:
      context: .
      args: { SERVICE: discovery-service }
    image: plantshop/discovery-service
    container_name: plantshop-discovery-service
    ports: ["8761:8761"]
    environment:
      CONFIG_SERVER_URL: http://config-service:8888
    depends_on:
      config-service:
        condition: service_healthy
    healthcheck:
      <<: *port-healthcheck
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/8761"]
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      args: { SERVICE: api-gateway }
    image: plantshop/api-gateway
    container_name: plantshop-api-gateway
    ports: ["8080:8080"]
    environment:
      <<: *spring-env
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    restart: unless-stopped

  # ---------- Business services ----------
  catalog-service:
    <<: *business-service
    build:
      context: .
      args: { SERVICE: catalog-service }
    image: plantshop/catalog-service
    container_name: plantshop-catalog-service
    ports: ["8081:8081"]
    environment:
      <<: *spring-env
      DB_HOST: catalog-db
    depends_on:
      <<: *business-deps
      catalog-db:
        condition: service_healthy

  inventory-service:
    <<: *business-service
    build:
      context: .
      args: { SERVICE: inventory-service }
    image: plantshop/inventory-service
    container_name: plantshop-inventory-service
    ports: ["8082:8082"]
    environment:
      <<: *spring-env
      DB_HOST: inventory-db
    depends_on:
      <<: *business-deps
      inventory-db:
        condition: service_healthy

  order-service:
    <<: *business-service
    build:
      context: .
      args: { SERVICE: order-service }
    image: plantshop/order-service
    container_name: plantshop-order-service
    ports: ["8083:8083"]
    environment:
      <<: *spring-env
      DB_HOST: order-db
    depends_on:
      <<: *business-deps
      order-db:
        condition: service_healthy

  payment-service:
    <<: *business-service
    build:
      context: .
      args: { SERVICE: payment-service }
    image: plantshop/payment-service
    container_name: plantshop-payment-service
    ports: ["8084:8084"]
    environment:
      <<: *spring-env
      DB_HOST: payment-db
    depends_on:
      <<: *business-deps
      payment-db:
        condition: service_healthy

volumes:
  catalog-db-data:
  inventory-db-data:
  order-db-data:
  payment-db-data:
